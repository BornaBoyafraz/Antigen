[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigen"
version = "0.1.0"
description = "A small prompt-injection detector that explains why it flagged something"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.scripts]
antigen = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",
]

[tool.setuptools]
py-modules = ["features", "model", "explain", "conversation", "baselines", "cli", "antigen", "persistence"]

[tool.setuptools.packages.find]
include = ["eval*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
